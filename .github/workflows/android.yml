name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Lint & APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Eigener Signaturschlüssel (optional, aus Secrets)
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Unit- & Screenshot-Tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew lintRelease

      - name: Release-APK bauen
        run: ./gradlew assembleRelease

      - name: APK benennen
        id: apk
        run: |
          VERSION="1.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Umgangstagebuch-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=Umgangstagebuch-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Umgangstagebuch-APK
          path: ${{ steps.apk.outputs.file }}

      - name: Screenshots & Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-und-berichte
          path: |
            app/build/screenshots
            app/build/reports
          if-no-files-found: ignore

      - name: GitHub-Release erstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Umgangstagebuch ${{ steps.apk.outputs.version }}
          body: |
            Neue Version zum Installieren auf dem Handy.
            APK unten unter „Assets“ herunterladen und öffnen. Updates installieren sich über die alte Version – die Daten bleiben im gewählten Ordner erhalten.
          files: ${{ steps.apk.outputs.file }}
